trigger:
  branches:
    include:
      - none
      #- main


pr:
  branches:
    include:
      - none

resources:
  repositories:
    - repository: tf_tpl
      type: git
      name: IaC/template
      ref: refs/heads/main

pool:
  name: "IaCRunner"
  demands:
    - Agent.OS -equals Linux

variables:
  - name: env
    ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      value: "prod"
    ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
      value: "dev"
    ${{ if eq(variables['Build.SourceBranchName'], 'sbx') }}:
      value: "sbx"
  - name: subscription
    ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      value: "prod"
    ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
      value: "nonprod"
    ${{ if eq(variables['Build.SourceBranchName'], 'sbx') }}:
      value: "sbx"
  - name: projectFile
    value: "WebCcoeDemo.Web.csproj"
  - name: buildConfiguration
    value: "Release"
  - name: azureServiceConnection
    value: "sc-ccoe-iac-devops-${{ variables.subscription }}"
  - name: webAppNamePrimary
    value: "web-platform-eus-dev-dotnet"
  - name: webAppNameSecondary
    value: ""
  - name: webAppNameThird
    value: ""
  - name: publishDir
    value: "$(Build.ArtifactStagingDirectory)/publish"
  - name: packagePath
    value: "$(Build.ArtifactStagingDirectory)/app.zip"
  - name: dotnetSdkVersion
    value: "8.0.x"
  - name: linuxDotnetRuntimeStack
    value: "DOTNETCORE|8.0"

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        displayName: Build self-contained package
        steps:
          - template: templates/shared-runner-hygiene.yml@tf_tpl
            parameters:
              configureNuGetCache: true
              runPostJobCleanup: false

          - checkout: self
            clean: true
            persistCredentials: false

          - task: UseDotNet@2
            displayName: Install .NET 8 SDK
            inputs:
              packageType: sdk
              version: "$(dotnetSdkVersion)"

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: "$(projectFile)"
              feedsToUse: config
              nugetConfigPath: NuGet.config

          - task: DotNetCoreCLI@2
            displayName: Publish
            inputs:
              command: publish
              publishWebProjects: false
              projects: "$(projectFile)"
              arguments: "--configuration $(buildConfiguration) --output $(publishDir)"
              modifyOutputPath: false
              zipAfterPublish: false

          - task: ArchiveFiles@2
            displayName: Archive application package
            inputs:
              rootFolderOrFile: "$(publishDir)"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(packagePath)"
              replaceExistingArchive: true

          - script: |
              set -euo pipefail
              unzip -l "$(packagePath)" | awk '{print $4}' | grep -x "web.config" > /dev/null
            displayName: Validate package root contains web.config

          - publish: "$(packagePath)"
            displayName: Publish artifact
            artifact: drop

          - template: templates/shared-runner-hygiene.yml@tf_tpl
            parameters:
              runInitialization: false
              runPreJobCleanup: false
              runCachePrep: false

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Deploy
        displayName: Deploy to Azure App Service
        steps:
          - template: templates/shared-runner-hygiene.yml@tf_tpl
            parameters:
              runPostJobCleanup: false

          - download: current
            displayName: Download artifact
            artifact: drop

          - task: AzureCLI@2
            displayName: Deploy package-mounted web apps
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                packagePath="$(Pipeline.Workspace)/drop/app.zip"

                test_scm_connectivity() {
                  local host_name="$1"

                  echo "Starting SCM connectivity preflight for ${host_name}..."

                  if getent ahosts "${host_name}" > /tmp/scm_dns.txt 2>/tmp/scm_dns_err.txt; then
                    awk '!seen[$1 FS $2]++ { printf("SCM resolved address [%s]: %s\n", $2, $1) }' /tmp/scm_dns.txt
                  else
                    cat /tmp/scm_dns_err.txt || true
                    if command -v nslookup >/dev/null 2>&1; then
                      nslookup "${host_name}" || true
                    fi
                    echo "Failed to resolve ${host_name} from the build agent." >&2
                    exit 1
                  fi

                  echo "SCM TCP probe: testing ${host_name}:443"
                  if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/${host_name}/443" 2>/tmp/scm_tcp_err.txt; then
                    cat /tmp/scm_tcp_err.txt || true
                    echo "Failed to reach https://${host_name} from the build agent." >&2
                    exit 1
                  fi
                }

                deploy_target() {
                  local app_name="$1"

                  if [ -z "${app_name}" ]; then
                    echo "Deployment target is blank. Skipping."
                    return 0
                  fi

                  local app_id
                  local subscription_id
                  local resource_group
                  local scm_host
                  local app_os

                  app_id="$(az resource list --name "${app_name}" --resource-type "Microsoft.Web/sites" --query "[0].id" --output tsv)"
                  if [ -z "${app_id}" ]; then
                    echo "App Service '${app_name}' was not found. Skipping deployment."
                    return 0
                  fi

                  subscription_id="$(echo "${app_id}" | cut -d/ -f3)"
                  resource_group="$(echo "${app_id}" | cut -d/ -f5)"
                  scm_host="${app_name}.scm.azurewebsites.net"

                  echo "Deploying package-mounted app to ${app_name} in ${resource_group}..."
                  az account set --subscription "${subscription_id}"
                  test_scm_connectivity "${scm_host}"

                  app_os="$(az webapp show --resource-group "${resource_group}" --name "${app_name}" --query reserved --output tsv | tr '[:upper:]' '[:lower:]')"
                  echo "Detected reserved value for ${app_name}: ${app_os}"

                  if [ "${app_os}" = "true" ]; then
                    az webapp config set \
                      --resource-group "${resource_group}" \
                      --name "${app_name}" \
                      --linux-fx-version "$(linuxDotnetRuntimeStack)"
                  fi

                  az webapp config appsettings delete \
                    --resource-group "${resource_group}" \
                    --name "${app_name}" \
                    --setting-names SCM_DO_BUILD_DURING_DEPLOYMENT ENABLE_ORYX_BUILD || true

                  az webapp config appsettings set \
                    --resource-group "${resource_group}" \
                    --name "${app_name}" \
                    --settings \
                      WEBSITE_RUN_FROM_PACKAGE=1 \
                      APP_SERVICE_NAME="${app_name}" \
                      APP_SERVICE_SUBSCRIPTION_ID="${subscription_id}" \
                      APP_SERVICE_RESOURCE_GROUP="${resource_group}"

                  # Clear any linked source-control deployment config so Kudu treats this as a pure ZIP push.
                  az webapp deployment source delete \
                    --resource-group "${resource_group}" \
                    --name "${app_name}" || true

                  az webapp deployment source config-zip \
                    --resource-group "${resource_group}" \
                    --name "${app_name}" \
                    --src "${packagePath}"
                }

                deploy_target "$(webAppNamePrimary)"
                deploy_target "$(webAppNameSecondary)"
                deploy_target "$(webAppNameThird)"

          - template: templates/shared-runner-hygiene.yml@tf_tpl
            parameters:
              runInitialization: false
              runPreJobCleanup: false
              runCachePrep: false
